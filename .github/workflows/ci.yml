name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts (the render tests need them)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest -q
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/secret-scan.mjs
